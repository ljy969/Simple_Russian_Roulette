<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto">
<head>
<meta charset="UTF-8">
<title>俄罗斯轮盘赌</title>
<style>
  /* ===== 浅色主题（默认） ===== */
  :root {
    color-scheme: light;
    --bg-color: #f7f7f7;
    --text-color: #333333;
    --text-secondary: #666666;
    --card-bg: #ffffff;
    --card-border: #dddddd;
    --input-bg: #ffffff;
    --input-border: #dddddd;
    --btn-bg: #ffffff;
    --btn-border: #dddddd;
    --btn-hover-bg: #f0f0f0;
    --shadow: 0 2px 5px rgba(0,0,0,0.1);
    --danger: #e74c3c;
    --success: #27ae60;
    --theme-active-bg: #333333;
    --theme-active-color: #ffffff;
  }

  /* ===== 手动深色主题 ===== */
  [data-theme="dark"] {
    color-scheme: dark;
    --bg-color: #121212;
    --text-color: #e0e0e0;
    --text-secondary: #a0a0a0;
    --card-bg: #1e1e1e;
    --card-border: #333333;
    --input-bg: #2a2a2a;
    --input-border: #444444;
    --btn-bg: #2a2a2a;
    --btn-border: #444444;
    --btn-hover-bg: #3a3a3a;
    --shadow: 0 2px 8px rgba(0,0,0,0.5);
    --danger: #ff6b6b;
    --success: #51cf66;
    --theme-active-bg: #e0e0e0;
    --theme-active-color: #121212;
  }

  /* ===== 跟随系统深色 ===== */
  @media (prefers-color-scheme: dark) {
    [data-theme="auto"] {
      color-scheme: dark;
      --bg-color: #121212;
      --text-color: #e0e0e0;
      --text-secondary: #a0a0a0;
      --card-bg: #1e1e1e;
      --card-border: #333333;
      --input-bg: #2a2a2a;
      --input-border: #444444;
      --btn-bg: #2a2a2a;
      --btn-border: #444444;
      --btn-hover-bg: #3a3a3a;
      --shadow: 0 2px 8px rgba(0,0,0,0.5);
      --danger: #ff6b6b;
      --success: #51cf66;
      --theme-active-bg: #e0e0e0;
      --theme-active-color: #121212;
    }
  }

  /* ===== 基础样式 ===== */
  body {
    font-family: 'Arial', sans-serif;
    text-align: center;
    margin-top: 50px;
    background-color: var(--bg-color);
    color: var(--text-color);
    transition: background-color 0.3s ease, color 0.3s ease;
  }

  h1 { color: var(--text-color); font-size: 2em; }
  p  { color: var(--text-secondary); font-size: 1em; }

  /* ===== 主题切换器 ===== */
  .theme-switcher {
    position: fixed;
    top: 15px;
    right: 20px;
    display: flex;
    gap: 6px;
    z-index: 100;
  }

  .theme-btn {
    width: 40px; height: 40px;
    font-size: 1.2em;
    border-radius: 50%;
    border: 2px solid var(--card-border);
    background-color: var(--card-bg);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.3s ease;
    padding: 0; margin: 0;
  }

  .theme-btn:hover {
    border-color: var(--text-secondary);
    transform: scale(1.1);
  }

  .theme-btn.active {
    background-color: var(--theme-active-bg);
    border-color: var(--theme-active-bg);
  }

  /* ===== 控制面板 ===== */
  .control-panel {
    background-color: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 8px;
    padding: 20px;
    margin: 20px auto;
    max-width: 500px;
    box-shadow: var(--shadow);
    transition: background-color 0.3s ease, border-color 0.3s ease;
  }

  .input-group { margin: 15px 0; }

  label {
    display: inline-block;
    width: 120px;
    text-align: right;
    margin-right: 10px;
    color: var(--text-color);
  }

  input {
    padding: 8px; width: 60px;
    border: 1px solid var(--input-border);
    border-radius: 4px;
    background-color: var(--input-bg);
    color: var(--text-color);
    transition: background-color 0.3s ease, border-color 0.3s ease;
  }

  /* ===== 按钮 ===== */
  button {
    padding: 10px 20px;
    font-size: 1em;
    cursor: pointer;
    background-color: var(--btn-bg);
    color: var(--text-color);
    border: 1px solid var(--btn-border);
    border-radius: 4px;
    margin: 10px;
    transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
  }

  button:hover { background-color: var(--btn-hover-bg); }
  button:disabled { cursor: not-allowed; opacity: 0.6; }

  /* ===== 结果与信息 ===== */
  #result {
    font-size: 1.5em;
    font-weight: bold;
    margin: 20px;
    min-height: 30px;
    color: var(--text-color);
  }

  .bullet-info { font-size: 1.2em; margin: 15px 0; color: var(--text-color); }
  .bullet-info p { color: var(--text-color); }

    border-radius: 4px;
  }

  button {
    padding: 10px 20px;
    font-size: 1em;
    cursor: pointer;
    background-color: #fff;
    border: 1px solid #ddd;
    border-radius: 4px;
    margin: 10px;
    transition: background-color 0.3s;
  }

  button:hover {
    background-color: #f0f0f0;
  }

  button:disabled {
    cursor: not-allowed;
    opacity: 0.6;
  }

  #result {
    font-size: 1.5em;
    font-weight: bold;
    margin: 20px;
    min-height: 30px;
  }

  .bullet-info {
    font-size: 1.2em;
    margin: 15px 0;
  }
</style>
</head>
<body>
<div class="theme-switcher">
  <button class="theme-btn" data-theme="light" title="浅色模式">☀️</button>
  <button class="theme-btn" data-theme="dark" title="深色模式">🌙</button>
  <button class="theme-btn active" data-theme="auto" title="跟随系统">💻</button>
</div>

<h1>自定义俄罗斯转盘游戏</h1>

<div class="control-panel">
  <div class="input-group">
    <label for="totalInput">子弹总数:</label>
    <input type="number" id="totalInput" min="2" max="20" value="6">
  </div>
  
  <div class="input-group">
    <label for="liveInput">实弹数量:</label>
    <input type="number" id="liveInput" min="1" max="19" value="1">
  </div>
  
  <div class="input-group">
    <label for="emptyInput">虚弹数量:</label>
    <input type="number" id="emptyInput" min="1" max="19" value="5" disabled>
  </div>
  
  <button id="setupBtn">设置子弹</button>
  <button id="randomBtn">随机设置</button>
</div>

<div class="bullet-info">
  <p>子弹总数: <span id="totalBullets">6</span>颗</p>
  <p>实弹数量: <span id="liveBullets">1</span>颗</p>
  <p>虚弹数量: <span id="emptyBullets">5</span>颗</p>
</div>

<div id="result">等待开始...</div>

<button id="trigger">扣动扳机</button>
<button id="reload">重新装弹</button>
<button id="spinButton">转动轮盘</button>

<script>
// 游戏状态变量
let totalBullets = 6;
let liveBullets = 1;
let emptyBullets = 5;
let gameActive = false;
let chamber = []; // 弹巢数组，true=实弹，false=空包弹
let currentIndex = 0;

// DOM元素
const totalInput = document.getElementById('totalInput');
const liveInput = document.getElementById('liveInput');
const emptyInput = document.getElementById('emptyInput');
const totalDisplay = document.getElementById('totalBullets');
const liveDisplay = document.getElementById('liveBullets');
const emptyDisplay = document.getElementById('emptyBullets');
const resultDisplay = document.getElementById('result');
const triggerBtn = document.getElementById('trigger');
const reloadBtn = document.getElementById('reload');
const setupBtn = document.getElementById('setupBtn');
const randomBtn = document.getElementById('randomBtn');
const spinBtn = document.getElementById('spinButton');

// 初始化游戏（构建并洗牌）
function initGame() {
  // 构建弹巢数组
  chamber = Array(liveBullets).fill(true).concat(Array(emptyBullets).fill(false));
  
  // Fisher-Yates 洗牌算法
  for (let i = chamber.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [chamber[i], chamber[j]] = [chamber[j], chamber[i]];
  }
  
  currentIndex = 0;
  gameActive = true;
  triggerBtn.disabled = false;
  updateBulletDisplays();
  resultDisplay.textContent = "子弹已上膛，等待扣动扳机...";
  resultDisplay.style.color = "var(--text-color)";
}

// 更新子弹显示
function updateBulletDisplays() {
  totalDisplay.textContent = totalBullets;
  liveDisplay.textContent = liveBullets;
  emptyDisplay.textContent = emptyBullets;
}

// 设置自定义子弹
function setupCustomBullets() {
  const newTotal = parseInt(totalInput.value);
  const newLive = parseInt(liveInput.value);
  
  // 验证输入
  if (isNaN(newTotal) || isNaN(newLive)) {
    alert("请输入有效的数字");
    return;
  }
  
  if (newLive >= newTotal) {
    alert("实弹数量必须小于子弹总数");
    return;
  }
  
  if (newLive < 1 || newTotal < 2) {
    alert("实弹数量至少为1，子弹总数至少为2");
    return;
  }
  
  totalBullets = newTotal;
  liveBullets = newLive;
  emptyBullets = newTotal - newLive;
  
  initGame();
}

// 随机设置子弹
function setupRandomBullets() {
  totalBullets = Math.floor(Math.random() * 10) + 3; // 3-12颗子弹
  liveBullets = Math.floor(Math.random() * (totalBullets - 1)) + 1; // 至少1颗实弹
  emptyBullets = totalBullets - liveBullets;
  
  // 更新输入框
  totalInput.value = totalBullets;
  liveInput.value = liveBullets;
  emptyInput.value = emptyBullets;
  
  initGame();
}

// 扣动扳机（无放回抽样）
function pullTrigger() {
  if (!gameActive || currentIndex >= chamber.length) return;
  
  const isLive = chamber[currentIndex];
  currentIndex++;
  totalBullets--;
  
  if (isLive) {
    liveBullets--;
    resultDisplay.textContent = "💥 砰！中弹了！";
    resultDisplay.style.color = "red";
    playSound("https://www.soundjay.com/misc/sounds/gun-shot-01.mp3");
  } else {
    emptyBullets--;
    resultDisplay.textContent = "😌 咔哒... 是空包弹";
    resultDisplay.style.color = "green";
    playSound("https://www.soundjay.com/mechanical/sounds/revolver-cylinder-01.mp3");
  }
  
  updateBulletDisplays();
  
  // 检查游戏是否结束
  if (currentIndex >= chamber.length) {
    gameActive = false;
    triggerBtn.disabled = true;
    setTimeout(() => {
      alert("所有子弹已发射完毕！");
    }, 500);
  }
}

// 重新装弹
function reloadChamber() {
  if (confirm("确定要重新装弹吗？当前游戏进度将丢失。")) {
    setupCustomBullets();
  }
}

// 播放音效
function playSound(url) {
  try {
    const audio = new Audio(url);
    audio.play().catch(e => console.log("音效播放被阻止:", e));
  } catch (e) {
    console.log("音效加载错误:", e);
  }
}

// 转动轮盘（真正重置弹巢顺序）
function spinChamber() {
  if (!gameActive) {
    alert("请先设置子弹！");
    return;
  }
  
  playSound("https://www.soundjay.com/mechanical/sounds/revolver-spin-01.mp3");
  resultDisplay.textContent = "🔄 轮盘转动中...";
  resultDisplay.style.color = "var(--text-color)";
  
  setTimeout(() => {
    initGame(); // 重新洗牌并重置索引
    resultDisplay.textContent = "轮盘已重新就位";
  }, 1500);
}

// 事件监听
setupBtn.addEventListener('click', setupCustomBullets);
randomBtn.addEventListener('click', setupRandomBullets);
triggerBtn.addEventListener('click', pullTrigger);
reloadBtn.addEventListener('click', reloadChamber);
spinBtn.addEventListener('click', spinChamber);

// 输入框联动与边界修正
totalInput.addEventListener('input', function() {
  const total = parseInt(this.value) || 0;
  let live = parseInt(liveInput.value) || 0;
  
  if (total > 0 && live >= total) {
    live = total - 1;
    liveInput.value = live;
  }
  if (total > 0) {
    emptyInput.value = total - live;
  }
});

liveInput.addEventListener('input', function() {
  let live = parseInt(this.value) || 0;
  const total = parseInt(totalInput.value) || 0;
  
  if (total > 0 && live >= total) {
    live = total - 1;
    this.value = live;
  }
  if (total > 0) {
    emptyInput.value = total - live;
  }
});

// ===== 主题切换 =====
const themeBtns = document.querySelectorAll('.theme-btn');

function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  themeBtns.forEach(function(btn) {
    btn.classList.toggle('active', btn.getAttribute('data-theme') === theme);
  });
  try { localStorage.setItem('rr-theme', theme); } catch(e) {}
}

// 读取上次选择，默认跟随系统
(function() {
  var saved = 'auto';
  try { saved = localStorage.getItem('rr-theme') || 'auto'; } catch(e) {}
  applyTheme(saved);
})();

themeBtns.forEach(function(btn) {
  btn.addEventListener('click', function() {
    applyTheme(this.getAttribute('data-theme'));
  });
});

// 初始游戏设置
initGame();
</script>
</body>
</html>
